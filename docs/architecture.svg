<text x="35" y="578" font-size="21" fill="#102c50">Availability design: pod probes, graceful shutdown, rolling updates, and voluntary-eviction PDB.</text>
<text x="35" y="611" font-size="21" fill="#52657c">Spread rules act during scheduling; surviving pods can share a node after scale-down.</text>
