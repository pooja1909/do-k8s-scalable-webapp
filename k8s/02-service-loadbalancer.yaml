# A Service of type LoadBalancer makes DOKS create a DigitalOcean Load Balancer automatically.
# The Load Balancer sends traffic to the worker nodes; Kubernetes then spreads it across the app pods.
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: web-app
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "web-app-lb"
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
    # Retain DOKS-managed node health checks. App health is checked by pod probes.
spec:
  type: LoadBalancer
  selector:
    app: web-app
  ports:
    - name: http
      port: 80
      targetPort: http
