# The web app itself. Key choices:
#  - HPA manages replicas (minimum 2); topology spread guides placement at scheduling time
#  - CPU/memory requests let the scheduler and the HPA make good decisions (performance + cost)
#  - Readiness/liveness probes keep traffic away from pods that are not ready (reliability)
#  - maxUnavailable: 0 preserves desired available capacity during normal rolling updates
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: web-app
  labels:
    app: web-app
spec:
  # No replicas field: scripts/03-deploy.sh safely migrates its last-applied ownership to the HPA.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # add one new pod at a time
      maxUnavailable: 0            # never drop below the current capacity during a deploy
  template:
    metadata:
      labels:
        app: web-app
    spec:
      terminationGracePeriodSeconds: 30
      # Placement is constrained at scheduling time; scale-down does not rebalance surviving pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule   # enforce skew across eligible nodes when scheduling
          labelSelector:
            matchLabels:
              app: web-app
          # Count only pods from the current version, so a rolling update doesn't
          # balance new pods against old ones that are about to be deleted.
          matchLabelKeys:
            - pod-template-hash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web-app
          image: IMAGE_PLACEHOLDER   # replaced by scripts/03-deploy.sh with your DOCR image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "VERSION_PLACEHOLDER"
            # Downward API: lets the page show which pod and node served each request.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m              # HPA targets are a percentage of this request
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # Allow for the busy Node.js event loop during CPU-heavy requests.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6        # restart only after ~60s of no response
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
