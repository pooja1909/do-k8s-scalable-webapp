# PodDisruptionBudget: constrain voluntary evictions (e.g. node drains) to minAvailable: 1.
# Does not prevent involuntary node failures or control Deployment scale-down / rolling updates.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-app
  namespace: web-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-app
